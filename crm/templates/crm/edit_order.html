{% load static %}

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buyurtmani tahrirlash</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }

        .page {
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container-box {
            max-width: 850px;
            margin: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .back-btn {
            text-decoration: none;
            background: white;
            color: #374151;
            padding: 11px 18px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            transition: .2s;
        }

        .back-btn:hover {
            background: #f3f4f6;
        }

        .card-box {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
        }

        .order-info {
            background: #f8fafc;
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 25px;
        }

        .order-info strong {
            font-size: 18px;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 12px 14px;
            border: 1px solid #dbe1e8;
        }

        .form-control:focus,
        .form-select:focus {
            box-shadow: none;
            border-color: #6366f1;
        }

        .save-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 10px;
            font-weight: 600;
            transition: .2s;
        }

        .save-btn:hover {
            background: #4f46e5;
        }

        .cancel-btn {
            text-decoration: none;
            color: #6b7280;
            padding: 13px 22px;
            font-weight: 600;
        }

        .cancel-btn:hover {
            color: #111827;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
        }

        @media (max-width: 600px) {
            .top {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .card-box {
                padding: 20px;
            }

            .buttons {
                flex-direction: column-reverse;
                align-items: stretch;
            }

            .save-btn,
            .cancel-btn {
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="container-box">

        <div class="top">
            <h1>
                <i class="bi bi-pencil-square"></i>
                Buyurtmani tahrirlash
            </h1>

            <a href="{% url 'order_detail' order.id %}" class="back-btn">
                <i class="bi bi-arrow-left"></i>
                Orqaga
            </a>
        </div>


        <div class="card-box">

            <div class="order-info">
                <div class="text-muted mb-1">
                    Buyurtma #{{ order.id }}
                </div>

                <strong>
                    {{ order.customer.name }}
                </strong>
            </div>


            <form method="POST">

                {% csrf_token %}


                <div class="mb-4">

                    <label class="form-label">
                        Buyurtma nomi
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        value="{{ order.title }}"
                        placeholder="Masalan: Premium paket"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Summa
                    </label>

                    <input
                        type="number"
                        name="amount"
                        class="form-control"
                        value="{{ order.amount }}"
                        step="0.01"
                        min="0"
                        placeholder="Masalan: 150000"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Holati
                    </label>

                    <select
                        name="status"
                        class="form-select"
                        required
                    >

                        <option
                            value="new"
                            {% if order.status == 'new' %}selected{% endif %}
                        >
                            Yangi
                        </option>

                        <option
                            value="processing"
                            {% if order.status == 'processing' %}selected{% endif %}
                        >
                            Jarayonda
                        </option>

                        <option
                            value="completed"
                            {% if order.status == 'completed' %}selected{% endif %}
                        >
                            Tugallangan
                        </option>

                        <option
                            value="cancelled"
                            {% if order.status == 'cancelled' %}selected{% endif %}
                        >
                            Bekor qilingan
                        </option>

                    </select>

                </div>


                <div class="buttons">

                    <a
                        href="{% url 'order_detail' order.id %}"
                        class="cancel-btn"
                    >
                        Bekor qilish
                    </a>

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        <i class="bi bi-check-lg"></i>
                        Saqlash
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
