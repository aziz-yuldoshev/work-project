<!DOCTYPE html>

<html lang="uz">

<head>


    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Yangi mijoz | CRM</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            margin: 0;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .main {
            min-height: 100vh;
            padding: 40px 20px;
        }

        .form-card {
            max-width: 650px;
            margin: auto;
            background: white;
            border-radius: 18px;
            padding: 35px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .form-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .form-title-icon {
            width: 48px;
            height: 48px;
            background: #eef2ff;
            color: #4f46e5;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
        }

        .form-title h1 {
            margin: 0;
            font-size: 25px;
            font-weight: bold;
        }

        .form-title p {
            margin: 4px 0 0;
            color: #6b7280;
            font-size: 14px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            min-height: 46px;
            border-radius: 9px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn-save {
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 9px;
            padding: 11px 20px;
        }

        .btn-save:hover {
            background: #4338ca;
            color: white;
        }

        .btn-cancel {
            background: #f3f4f6;
            color: #374151;
            border-radius: 9px;
            padding: 11px 20px;
            text-decoration: none;
        }

        .btn-cancel:hover {
            background: #e5e7eb;
            color: #111827;
        }

    </style>


</head>

<body>

<div class="main">


    <div class="form-card">

        <div class="form-title">

            <div class="form-title-icon">

                <i class="bi bi-person-plus-fill"></i>

            </div>

            <div>

                <h1>
                    Yangi mijoz
                </h1>

                <p>
                    CRM bazasiga yangi mijoz qo‘shing.
                </p>

            </div>

        </div>


        <form method="POST">

            {% csrf_token %}


            <div class="mb-4">

                <label class="form-label">
                    Mijoz ismi
                </label>

                <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Masalan: Ali Valiyev"
                        required
                >

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Telefon
                </label>

                <input
                        type="text"
                        name="phone"
                        class="form-control"
                        placeholder="+998 90 123 45 67"
                        required
                >

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Email
                </label>

                <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="example@gmail.com"
                >

            </div>

            <div class="mb-3">
                <label class="form-label">Manzil</label>

                <textarea
                        name="address"
                        class="form-control"
                        rows="3"
                        placeholder="Mijoz manzilini kiriting"></textarea>
            </div>


            <div class="mb-4">

                <label class="form-label">
                    Status
                </label>

                <select
                        name="status"
                        class="form-select"
                >

                    <option value="new">
                        Yangi
                    </option>

                    <option value="active">
                        Faol
                    </option>

                    <option value="inactive">
                        Faol emas
                    </option>

                </select>

            </div>


            <div class="buttons">

                <button
                        type="submit"
                        class="btn-save"
                >

                    <i class="bi bi-check-lg"></i>

                    Saqlash

                </button>


                <a
                        href="{% url 'customers' %}"
                        class="btn-cancel"
                >

                    Bekor qilish

                </a>

            </div>

        </form>

    </div>


</div>

</body>

</html>
