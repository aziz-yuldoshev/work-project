<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buyurtmani o‘chirish</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .delete-card {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,.08);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fee2e2;
            color: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 12px;
        }

        .info {
            background: #f8fafc;
            padding: 18px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .info strong {
            display: block;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .warning {
            color: #dc2626;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            text-decoration: none;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .cancel {
            background: #e5e7eb;
            color: #374151;
        }

        .delete {
            background: #dc2626;
            color: white;
        }

        .delete:hover {
            background: #b91c1c;
        }

        @media (max-width: 600px) {
            .delete-card {
                margin: 20px;
                padding: 30px 20px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="delete-card">

    <div class="icon">
        🗑
    </div>

    <h1>Buyurtmani o‘chirasizmi?</h1>

    <p>
        Quyidagi buyurtma butunlay o‘chiriladi.
    </p>

    <div class="info">
        <strong>{{ order.title }}</strong>

        <span>
            Mijoz: {{ order.customer.name }}
        </span>

        <br>

        <span>
            Summa: {{ order.amount }}
        </span>
    </div>

    <div class="warning">
        ⚠️ Bu amalni qaytarib bo‘lmaydi.
    </div>

    <form method="POST">

        {% csrf_token %}

        <div class="buttons">

            <a
                href="{% url 'order_detail' order.id %}"
                class="btn cancel"
            >
                Bekor qilish
            </a>

            <button
                type="submit"
                class="btn delete"
            >
                🗑 O‘chirish
            </button>

        </div>

    </form>

</div>

</body>
</html>
