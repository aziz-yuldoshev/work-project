<!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mahsulotni o‘chirish</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
        }

        .delete-card {
            max-width: 550px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,.07);
        }

        .warning-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .product-name {
            font-size: 22px;
            font-weight: 700;
            margin: 15px 0;
        }

        .btn {
            border-radius: 10px;
            padding: 11px 20px;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="delete-card">

        <div class="warning-icon">
            ⚠️
        </div>

        <h2>
            Mahsulotni o‘chirish
        </h2>

        <p class="text-muted">
            Quyidagi mahsulotni o‘chirmoqchimisiz?
        </p>

        <div class="product-name">
            📦 {{ product.name }}
        </div>

        <p class="text-muted">
            Bu amalni ortga qaytarib bo‘lmaydi.
        </p>


        <form method="POST">

            {% csrf_token %}

            <button
                type="submit"
                class="btn btn-danger"
            >
                🗑️ Ha, o‘chirish
            </button>

            <a
                href="{% url 'product_detail' product.id %}"
                class="btn btn-secondary"
            >
                Bekor qilish
            </a>

        </form>

    </div>

</div>

</body>

</html>
