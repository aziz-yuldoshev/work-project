<!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mahsulotni tahrirlash</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .form-card {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
        }

        .form-control,
        .form-select {
            padding: 12px;
            border-radius: 10px;
        }

        .form-control:focus,
        .form-select:focus {
            box-shadow: 0 0 0 3px rgba(13,110,253,.12);
        }

        .btn {
            border-radius: 10px;
            padding: 11px 20px;
            font-weight: 600;
        }

        /* ==========================================
           CURRENT IMAGE
        ========================================== */

        .current-image-box {
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .current-image {
            width: 230px;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,.12);
            display: block;
        }

        /* ==========================================
           IMAGE UPLOAD
        ========================================== */

        .image-upload-box {
            border: 2px dashed #ced4da;
            border-radius: 15px;
            padding: 25px;
            background: #fafafa;
            transition: .3s;
        }

        .image-upload-box:hover {
            border-color: #0d6efd;
            background: #f8fbff;
        }

        .image-icon {
            font-size: 42px;
            color: #0d6efd;
            margin-bottom: 10px;
        }

        /* ==========================================
           NEW IMAGE PREVIEW
        ========================================== */

        #imagePreview {
            display: none;
            width: 230px;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            margin-top: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,.12);
        }

        .preview-title {
            display: none;
            margin-top: 15px;
            font-weight: 600;
        }

        /* ==========================================
           HEADER
        ========================================== */

        .page-icon {
            font-size: 28px;
            margin-right: 8px;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="form-card">

        <!-- ==========================================
             HEADER
        ========================================== -->

        <h2 class="mb-2">

            <span class="page-icon">✏️</span>

            Mahsulotni tahrirlash

        </h2>

        <p class="text-muted mb-4">

            Mahsulot ma’lumotlarini o‘zgartiring

        </p>


        <!-- ==========================================
             FORM
        ========================================== -->

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <!-- ==========================================
                 NOMI
            ========================================== -->

            <div class="mb-3">

                <label class="form-label fw-semibold">

                    Mahsulot nomi

                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ product.name }}"
                    placeholder="Mahsulot nomi"
                    required
                >

            </div>


            <!-- ==========================================
                 TAVSIF
            ========================================== -->

            <div class="mb-3">

                <label class="form-label fw-semibold">

                    Tavsif

                </label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="4"
                    placeholder="Mahsulot haqida ma'lumot..."
                >{{ product.description }}</textarea>

            </div>


            <!-- ==========================================
                 NARX
            ========================================== -->

            <div class="mb-3">

                <label class="form-label fw-semibold">

                    Narx

                </label>

                <input
                    type="number"
                    name="price"
                    class="form-control"
                    value="{{ product.price }}"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <!-- ==========================================
                 QOLDIQ
            ========================================== -->

            <div class="mb-3">

                <label class="form-label fw-semibold">

                    Qoldiq

                </label>

                <input
                    type="number"
                    name="quantity"
                    class="form-control"
                    value="{{ product.quantity }}"
                    min="0"
                    required
                >

            </div>


            <!-- ==========================================
                 KATEGORIYA
            ========================================== -->

            <div class="mb-4">

                <label class="form-label fw-semibold">

                    Kategoriya

                </label>

                <input
                    type="text"
                    name="category"
                    class="form-control"
                    value="{{ product.category }}"
                    placeholder="Masalan: Elektronika"
                >

            </div>


            <!-- ==========================================
                 MAHSULOT RASMI
            ========================================== -->

            <div class="mb-4">

                <label class="form-label fw-semibold">

                    <i class="bi bi-image"></i>

                    Mahsulot rasmi

                </label>


                <!-- CURRENT IMAGE -->

                {% if product.image %}

                    <div class="current-image-box">

                        <p class="text-muted mb-2">

                            Hozirgi rasm:

                        </p>

                        <img
                            src="{{ product.image.url }}"
                            alt="{{ product.name }}"
                            class="current-image"
                        >

                    </div>

                {% else %}

                    <div class="alert alert-light border">

                        <i class="bi bi-image"></i>

                        Hozircha mahsulot rasmi mavjud emas.

                    </div>

                {% endif %}


                <!-- UPLOAD BOX -->

                <div class="image-upload-box">

                    <div class="text-center">

                        <div class="image-icon">

                            <i class="bi bi-cloud-arrow-up"></i>

                        </div>

                        <h6 class="fw-bold">

                            Yangi rasm tanlang

                        </h6>

                        <p class="text-muted mb-3">

                            JPG, PNG yoki WEBP format

                        </p>

                    </div>


                    <input
                        type="file"
                        name="image"
                        id="imageInput"
                        class="form-control"
                        accept="image/*"
                    >


                    <!-- PREVIEW TITLE -->

                    <div
                        id="previewTitle"
                        class="preview-title"
                    >

                        Yangi rasm:

                    </div>


                    <!-- PREVIEW -->

                    <img
                        id="imagePreview"
                        src="#"
                        alt="Yangi mahsulot rasmi"
                    >

                </div>

            </div>


            <!-- ==========================================
                 STATUS
            ========================================== -->

            <div class="mb-4">

                <label class="form-label fw-semibold">

                    Status

                </label>

                <select
                    name="status"
                    class="form-select"
                    required
                >

                    <option
                        value="active"
                        {% if product.status == 'active' %}
                            selected
                        {% endif %}
                    >

                        🟢 Mavjud

                    </option>


                    <option
                        value="inactive"
                        {% if product.status == 'inactive' %}
                            selected
                        {% endif %}
                    >

                        🔴 Nofaol

                    </option>

                </select>

            </div>


            <!-- ==========================================
                 BUTTONS
            ========================================== -->

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary"
                >

                    <i class="bi bi-check-circle"></i>

                    O‘zgarishlarni saqlash

                </button>


                <a
                    href="{% url 'product_detail' product.id %}"
                    class="btn btn-secondary"
                >

                    <i class="bi bi-arrow-left"></i>

                    Bekor qilish

                </a>

            </div>

        </form>

    </div>

</div>


<!-- ==========================================
     IMAGE PREVIEW JAVASCRIPT
========================================== -->

<script>

    const imageInput = document.getElementById("imageInput");

    const imagePreview = document.getElementById("imagePreview");

    const previewTitle = document.getElementById("previewTitle");


    imageInput.addEventListener("change", function () {

        const file = this.files[0];


        if (file) {

            // Rasm ekanligini tekshirish
            if (!file.type.startsWith("image/")) {

                alert("Iltimos, faqat rasm faylini tanlang.");

                imageInput.value = "";

                imagePreview.style.display = "none";

                previewTitle.style.display = "none";

                return;

            }


            const reader = new FileReader();


            reader.onload = function (event) {

                imagePreview.src = event.target.result;

                imagePreview.style.display = "block";

                previewTitle.style.display = "block";

            };


            reader.readAsDataURL(file);

        }

        else {

            imagePreview.style.display = "none";

            previewTitle.style.display = "none";

        }

    });

</script>


</body>

</html>
