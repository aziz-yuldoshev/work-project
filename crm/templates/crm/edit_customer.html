<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mijozni tahrirlash</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="background:#f5f7fb;">

<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width:600px;">

        <div class="card-body p-4">

            <h2 class="mb-4">
                Mijozni tahrirlash ✏️
            </h2>

            <form method="POST">

                {% csrf_token %}

                <!-- ISM -->
                <div class="mb-3">
                    <label class="form-label">
                        Ism
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ customer.name }}"
                        required
                    >
                </div>

                <!-- TELEFON -->
                <div class="mb-3">
                    <label class="form-label">
                        Telefon
                    </label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ customer.phone }}"
                        required
                    >
                </div>

                <!-- EMAIL -->
                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ customer.email|default:'' }}"
                    >
                </div>

                <!-- MANZIL -->
                <div class="mb-3">
                    <label class="form-label">
                        Manzil
                    </label>

                    <textarea
                        name="address"
                        class="form-control"
                        rows="3"
                        placeholder="Mijoz manzilini kiriting">{{ customer.address|default:'' }}</textarea>
                </div>

                <!-- STATUS -->
                <div class="mb-4">

                    <label class="form-label">
                        Status
                    </label>

                    <select name="status" class="form-select">

                        <option value="new"
                            {% if customer.status == 'new' %}selected{% endif %}>
                            Yangi
                        </option>

                        <option value="active"
                            {% if customer.status == 'active' %}selected{% endif %}>
                            Faol
                        </option>

                        <option value="inactive"
                            {% if customer.status == 'inactive' %}selected{% endif %}>
                            Faol emas
                        </option>

                    </select>

                </div>

                <!-- BUTTONS -->
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i>
                    Saqlash
                </button>

                <a href="{% url 'customers' %}"
                   class="btn btn-secondary">
                    Bekor qilish
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
